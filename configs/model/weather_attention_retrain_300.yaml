weather_attention:
  attributes: [fog, rain, snow, night]
  image_size: [384, 672]
  device: auto
  backbone:
    name: mobilenet_v3_large
    weights: IMAGENET1K_V2
    weights_file: artifacts/checkpoints/weather_attention/pretrained/mobilenet_v3_large-5c1a4163.pth
    feature_indices: [6, 12, 15]
    feature_channels: [40, 112, 160]
    feature_strides: [8, 16, 32]
    fine_tune_from: 13
    freeze_epochs: 5
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  head:
    dimension: 64
    heads: 4
    expansion: 2
    dropout: 0.2
  data:
    acdc_root: data/raw/acdc
    acdc_splits: [train, val, test]
    include_normal_references: true
    acdc_cleaning_manifest: data/processed/manifests/acdc.json
    pixel_zip: data/external/pixel_accurate_depth_benchmark/pixel_accurate_depth_benchmark/rgb_left_8bit.zip
    pixel_cleaning_manifest: data/processed/manifests/pixel_accurate_benchmark.json
    cache_dir: artifacts/cache/retrain_300_20261017/weather
    split_ratios:
      train: 0.6
      validation: 0.1
      calibration: 0.1
      test: 0.2
    seed: 42
  train:
    epochs: 300
    batch_size: 32
    backbone_learning_rate: 1.0e-5
    learning_rate: 0.0003
    weight_decay: 0.001
    warmup_epochs: 5
    minimum_lr_ratio: 0.02
    gradient_clip: 5.0
    amp: true
    channels_last: true
    brightness_range: [0.9, 1.1]
    contrast_range: [0.9, 1.1]
    horizontal_flip_probability: 0.5
    source_sampling_weights:
      acdc: 0.85
      pixel_accurate: 0.15
    schedule_epochs: 500
    early_stopping:
      enabled: true
      patience: 40
      min_delta: 0.0001
  loss:
    attribute_weights:
      fog: 1.0
      rain: 1.0
      snow: 1.0
      night: 1.0
    asl:
      gamma_positive: 1.0
      gamma_negative: 4.0
      clip: 0.05
  evaluation:
    batch_size: 64
    threshold_steps: 99
    selection_weights:
      fog: 2.0
      rain: 2.0
      snow: 1.0
      night: 1.0
    ap_selection_fraction: 0.5
    benchmark_iterations: 30
    benchmark_warmup: 5
    cpu_threads: 4
    old_config: configs/model/weather_classifier.yaml
    old_checkpoint: artifacts/checkpoints/weather_attributes/best.pt
    asl_config: configs/model/weather_pyramid.yaml
    asl_checkpoint: artifacts/checkpoints/weather_pyramid/asl/best.pt
    attention_references:
      baseline_a85:
        config: configs/model/weather_attention_a.yaml
        checkpoint: artifacts/checkpoints/weather_attention_ablation/reduced_tuning/best.pt
  checkpoint_root: artifacts/checkpoints/retrain_300_20261017/weather
  report_dir: artifacts/reports/retrain_300_20261017/weather
  report_file: artifacts/reports/retrain_300_20261017/weather/REPORT.md
