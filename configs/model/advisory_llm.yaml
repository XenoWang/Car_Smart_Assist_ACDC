# =============================================================================
# Stage 2：司机提示生成配置（VLM / LLM）
# =============================================================================
# 设计原则（重要，决定了这个模块长什么样）：
#
#   1. 决策与表达分离。
#      「要不要接管」由 advisory/policy/handover_rules.py 的规则引擎决定，
#      语言模型只负责把结论说得像人话。
#      理由：把安全决策交给生成模型是不可接受的 —— 同一个输入，模型今天说接管、
#      明天说不接管，而驾驶场景没有容错空间。生成模型可以有措辞波动，
#      不能有结论波动。
#
#   2. 必须有降级路径。
#      语言模型加载失败 / 超时 / 输出为空时，退回规则模板的静态文案。
#      任何情况下都不能出现「本帧无输出」。
#
#   3. 12GB 显存是硬约束（RTX 5070）。
#      默认走 4-bit QLoRA；全参微调在这个显存下不可行，不要尝试。
# =============================================================================

base: default.yaml

advisory:
  # --- 后端选择 ---
  backend:
    # local_vlm : 本地权重，可微调，显存吃紧
    # api       : OpenAI 兼容接口，无需显存，但需要联网与密钥；数据隐私上要谨慎
    # template  : 纯规则模板，无模型 —— 作为永远可用的兜底，也用作 baseline
    type: local_vlm
    fallback_chain: [local_vlm, template]   # 按顺序尝试，前一个失败就用下一个

  # --- 本地模型 ---
  local_vlm:
    # 基座模型不在代码里硬编码，只在这里指定。
    # 选择考量（12GB 显存 + 需要图像输入）：
    #   Qwen2.5-VL-3B-Instruct   推荐起点，4-bit 后约 3GB，留足空间给激活值
    #   Qwen2.5-VL-7B-Instruct   效果更好，4-bit 后约 6GB，batch_size 必须压到 1
    #   InternVL2-2B             更轻，中文略弱
    model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
    # 本地已有权重时填绝对路径，留空则从 HuggingFace 拉取
    local_path: null
    # 国内网络建议设置镜像（在 .env 里配 HF_ENDPOINT=https://hf-mirror.com）
    trust_remote_code: false       # 安全默认值；确需开启时在本文件里显式改为 true 并说明理由

    quantization:
      load_in_4bit: true
      bnb_4bit_compute_dtype: bfloat16   # Blackwell 原生支持 bf16
      bnb_4bit_quant_type: nf4
      bnb_4bit_use_double_quant: true

    dtype: bfloat16
    device_map: auto
    max_new_tokens: 128            # 司机提示必须短。128 token 足够，且限制分心
    temperature: 0.2               # 低温，减少措辞随机性
    do_sample: true
    top_p: 0.9
    repetition_penalty: 1.05
    # 首 token 延迟是关键体验指标，显存够时可以开 KV cache 加速
    use_cache: true

  # --- API 后端（可选，本地显存不足时切换）---
  api:
    enabled: false
    base_url: null                 # 例如 https://api.openai.com/v1
    model: null
    api_key_env: ADVISORY_API_KEY  # 密钥从环境变量读，绝不写进配置文件
    timeout_s: 10
    max_retries: 2

  # --- 提示词 ---
  prompt:
    system_prompt_file: src/car_smart_assist/advisory/prompt/system_prompt.py
    template_file: src/car_smart_assist/advisory/prompt/templates.py
    # 输出风格：concise=一句话结论+关键数字  detailed=再加一句原因
    style: concise
    # 是否把 Stage 1 的距离数值直接写进上下文。
    # 关掉的话模型只能说「前方有车」而不能说「前方约 30 米」——
    # 建议开着，但要在评测里检查模型有没有复述错数字。
    include_metric_values: true
    # 距离数值的呈现精度（米）。给太细会显得虚假精确，给太粗没有指导意义。
    distance_precision_m: 5

  # --- 决策策略（规则引擎，见 advisory/policy/handover_rules.py）---
  # 这一段的阈值直接关系安全，改动必须走 docs/adr/ 记录理由
  policy:
    # 距离阈值（米）—— 超过这些值就要提示
    distance_thresholds:
      critical: 15                 # < 15m：建议立即接管
      warning: 30                  # < 30m：提示注意
      notice: 50                   # < 50m：轻提示
    # 接管边界等级 -> 提示强度 的映射
    handover_level_to_action:
      0: no_action                 # 可继续辅助驾驶
      1: light_notice              # 接近边界，轻提示
      2: request_takeover          # 应立即接管
    # 天气权重：同样的距离，雨雪天要更早提示（制动距离变长）
    weather_risk_multiplier:
      fog:   1.4
      rain:  1.3
      snow:  1.6
      night: 1.2
    # 置信度低于此值时不下「无需接管」的结论，改为保守的「无法判断，请保持注意」。
    # 这是「宁可保守」原则的具体实现 —— 不确定时不给出安全承诺。
    min_confidence_for_clear: 0.7
    # 来车（对向）用更严格的阈值：会车时相对速度是叠加的
    oncoming_stricter_factor: 1.2

  # --- 生成后处理 ---
  postprocess:
    # 长度上限（字符）。超长提示会分散司机注意力，也说明模型跑偏了。
    max_chars: 60
    # 禁词表：出现这些词说明模型在越权承诺，直接判为不合格并降级到模板
    banned_phrases:
      - "自动驾驶"
      - "无需注意"
      - "绝对安全"
      - "可以睡觉"
    # 关键要素校验：提示里必须包含「动作」，不能只有描述
    require_action_keyword: true
