base: default.yaml

advisory:
  backend:
    type: local_vlm
    fallback_chain: [local_vlm, template]   # 按顺序尝试，前一个失败就用下一个

  local_vlm:
    model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
    local_path: null
    trust_remote_code: false       # 安全默认值；确需开启时在本文件里显式改为 true 并说明理由

    quantization:
      load_in_4bit: true
      bnb_4bit_compute_dtype: bfloat16   # Blackwell 原生支持 bf16
      bnb_4bit_quant_type: nf4
      bnb_4bit_use_double_quant: true

    dtype: bfloat16
    device_map: auto
    max_new_tokens: 128            # 司机提示必须短。128 token 足够，且限制分心
    temperature: 0.2               # 低温，减少措辞随机性
    do_sample: true
    top_p: 0.9
    repetition_penalty: 1.05
    use_cache: true

  api:
    enabled: false
    base_url: null                 # 例如 https://api.openai.com/v1
    model: null
    api_key_env: ADVISORY_API_KEY  # 密钥从环境变量读，绝不写进配置文件
    timeout_s: 10
    max_retries: 2

  prompt:
    system_prompt_file: src/car_smart_assist/advisory/prompt/system_prompt.py
    template_file: src/car_smart_assist/advisory/prompt/templates.py
    style: concise
    include_metric_values: true
    distance_precision_m: 5

  policy:
    distance_thresholds:
      critical: 15                 # < 15m：建议立即接管
      warning: 30                  # < 30m：提示注意
      notice: 50                   # < 50m：轻提示
    handover_level_to_action:
      0: no_action                 # 可继续辅助驾驶
      1: light_notice              # 接近边界，轻提示
      2: request_takeover          # 应立即接管
    weather_risk_multiplier:
      clear: 1.0                  # 预留给可输出正常天气的识别器
      fog:   1.4
      rain:  1.3
      snow:  1.6
      night: 1.2
    weather_risk_levels:
      clear: none
      fog: notice
      rain: notice
      snow: notice
      night: notice
    min_confidence_for_clear: 0.7
    oncoming_stricter_factor: 1.2
    uncertainty_sigma: 1.0
    max_distance_uncertainty_ratio: 0.5
    require_distance_uncertainty: false
    require_handover_head: false
    weather_handover_enabled: true
    weather_handover_conditions: [fog, rain, snow]

  postprocess:
    max_chars: 60
    banned_phrases:
      - "自动驾驶"
      - "无需注意"
      - "绝对安全"
      - "可以睡觉"
    require_action_keyword: true
