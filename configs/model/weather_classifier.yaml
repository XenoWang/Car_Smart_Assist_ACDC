# 天气现象与光照独立多标签识别；视觉线索不是物理量。
weather_classifier:
  attributes: [fog, rain, snow, night]
  image_size: [128, 224]            # [高, 宽]，维持 ACDC 约 16:9 的画幅
  channels: [16, 32, 64]
  dropout: 0.2
  checkpoint: artifacts/checkpoints/weather_attributes/best.pt
  device: auto                     # auto 优先 CUDA；不可用时用 CPU
  decision_thresholds:
    fog: 0.5
    rain: 0.77
    snow: 0.68
    night: 0.78
  features:
    road_top_fraction: 0.55        # 下部中央仅是道路区域近似，不是分割掩膜
    road_side_fraction: 0.15
    bright_threshold: 0.72
    dark_threshold: 0.38
    saturation_max: 0.25
    smooth_gradient_max: 0.06
  train:
    acdc_root: data/raw/acdc
    cache_dir: data/processed/weather
    epochs: 20
    batch_size: 16
    learning_rate: 0.001
    weight_decay: 0.0001
    label_smoothing: 0.05
    patience: 5
    num_workers: 0
    seed: 42
    validation_fraction: 0.2       # 合并官方 train/val 后按序列分组留出；官方 test 保持不动
    use_pixel_accurate: true       # 用天气/昼夜文件名标签学习可共存属性
    pos_weight_cap: 5.0            # 限制多标签正样本权重，避免稀有属性梯度过大
    pixel_accurate_zip: data/external/pixel_accurate_depth_benchmark/pixel_accurate_depth_benchmark/rgb_left_8bit.zip
    pixel_accurate_validation_scene: 4 # PAB 按整场景留出，避免相似场景帧泄漏
