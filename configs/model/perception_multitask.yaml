base: default.yaml

model:
  name: perception_multitask
  arch: multitask

  backbone:
    name: segformer
    variant: mit_b1
    pretrained: true
    pretrained_source: imagenet
    freeze_stages: 0
    out_indices: [0, 1, 2, 3]      # 输出四层特征金字塔，供不同 scale 的头使用

  heads:

    segmentation:
      enabled: true
      type: linear_fpn
      num_classes: 19
      ignore_index: 255
      feature_level: 3             # 用最高层特征（1/32）
      loss_weight: 1.0
      class_weighting: median_frequency

    road_condition:
      enabled: false
      loss_weight: 0.0

    handover:
      enabled: true
      type: pooling_cls
      num_levels: 3                # 0=可继续辅助驾驶  1=接近边界需注意  2=应立即接管
      loss_weight: 1.0
      asymmetric_weighting: true
      loss_level_weights: [1.0, 2.0, 4.0]   # 等级 2 的样本权重最高
      label_source: constructed
      labels_file: data/processed/handover/labels.json

    vehicle_detection:
      enabled: true
      type: anchor_free_single_scale
      num_classes: 8
      class_ids: [24, 25, 26, 27, 28, 31, 32, 33]   # Cityscapes ID，原生即是这些值
      label_source: acdc
      direction:
        enabled: true
        source: sequence_tracking
        num_classes: 2               # 0=同向(leading)  1=对向(oncoming)
        unknown_label: -1            # 不参与方向损失，仍参与框回归
        tracker:
          min_track_len: 5           # 轨迹短于这个长度就不用来判方向
          max_age: 30                # 丢失多少帧后终止轨迹
          iou_match_threshold: 0.3
        lateral_shift_threshold_px: null
        min_confidence: 0.6
        unknown_policy: exclude_from_direction_loss
        labels_file: data/processed/acdc/direction_labels.jsonl
      loss_weight: 0.5
      score_threshold: 0.3
      nms_iou_threshold: 0.5
      max_detections: 20

    distance:
      enabled: true
      type: box_mlp_regression
      predict_log: true
      loss_weight: 1.0
      loss_type: silu_huber        # 对离群标注鲁棒（距离标签里总有几帧是错的）
      predict_uncertainty: true
      bucket_weighting: true

  loss_balancing:
    strategy: uncertainty           # fixed | uncertainty | gradnorm
    fixed_weights:
      segmentation: 1.0
      road_condition: 0.0          # 独立天气模型不参与 Stage 1 多任务损失
      handover: 1.0
      vehicle_detection: 0.5
      distance: 1.0
    uncertainty_warmup_epochs: 2

ablations:
  - tag: no_segmentation        # 去掉分割头，看其他任务掉多少
  - tag: no_handover            # 去掉接管头（对照组）
  - tag: no_distance            # 去掉距离头
  - tag: fixed_loss_weights     # 用固定权重，对比 uncertainty 自动加权
  - tag: backbone_b0_vs_b1      # 骨干容量对比
  - tag: weather_aug_on         # 恶劣天气增强的增益
