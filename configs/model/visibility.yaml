# =============================================================================
# 能见度门控配置（无监督，第一阶段）
# =============================================================================
# 定位：感知链路最前面的闸门，也是「接管边界」最保守的一档 ——
#       不是「路况复杂建议接管」，而是「我看不见，必须接管」。
#
# 方法：卷积自编码器在 ACDC **正常天气参考图**上做自重建训练；
#       推理时以重建误差 + 确定性信息量特征共同判定。
#
# 为什么训练集必须只用正常天气参考图：
#   若把恶劣天气图也放进训练集，AE 会把浓雾、黑夜一并学会，
#   重建误差对所有人一样低，判别力归零。参考图是「清晰可见」的无标注样本，
#   用它们定义 normal 分布，重建误差才有意义。
# =============================================================================

base: ../default.yaml

visibility:
  # --- 数据 ---
  data:
    acdc_root: data/raw/acdc

    # --- 四划分（train / val / calib / test）---
    #
    # val 只用于早停和选择 best；calib 只用于最终零校准；test 只用于最终报告。
    # 三个留出集必须按序列互斥，避免视频相邻帧泄漏。
    train_ratio: 0.80
    val_ratio: 0.05          # 最佳权重选择 + 早停
    calib_ratio: 0.05        # 只用于最终零校准，不参与挑选权重
    test_ratio: 0.10         # 只用于最终报告

    # --- 划分模式 ---
    # fixed  : 固定种子，每次训练同一套划分。跨运行可比。**默认**
    # random : 每次训练换一套随机划分。
    #
    # ⚠️ 为什么不默认 random：两次运行的指标会测在**不同数据**上，于是
    #    「这次比上次好」无法判断是模型变好了还是这次抽到的集合更容易。
    #    迭代优化需要固定基准；阈值标定更需要 —— 漂移的阈值对安全门控是危险的。
    #    想要「每张图都被测到」的效果，正确做法是 k 折交叉验证，
    #    而不是每次换划分（后者连可比性都丢了）。
    split_mode: fixed
    split_seed: 42

    # --- 是否按视频序列整组划分 ---
    #
    # 必须保持 true。ACDC 的图像来自行车记录仪视频，同一 sequence 内相邻帧近乎重复。
    # 按图随机划分会把某帧放进训练集、它的邻居放进校准集 ——
    # 校准集里混进了训练样本的复制品，测出来的泛化能力是虚高的。
    # 实测：按图划分时 train/calib 误差比 1.34~1.56，
    #       按序列划分后这个差距才能反映真实的跨场景泛化。
    # 这一点与 docs/dataset.md 对 ACDC 主数据集的要求一致（那边也是按 scene 切）。
    split_by_sequence: true

    # 缩放尺寸 (H, W)。保持 16:9 避免拉伸 —— 拉伸会改变空间频率分布，
    # 而高频能量正是判「糊没糊」的关键量之一。
    input_size: [144, 256]
    # 磁盘缓存：把缩放后的图存成 npy，避免每个 epoch 重新解码 4006 张 1080p
    cache_path: data/processed/visibility/ref_images_144x256.npy
    num_workers: 4

  # --- 模型 ---
  model:
    in_channels: 3
    # 从 32 降到 16：实测 80/10/10 划分下训练集仅 3205 张，
    # 用 base_channels=32 时留出集误差比训练集高 34%（明显过拟合）。
    # 编码器参数量随 base_channels 平方缩放，减半后约降为 1/4。
    base_channels: 16       # 4 层后为 64 通道
    latent_dim: 256          # 压到 256 维（压缩比约 430:1），太宽会退化成恒等映射
    input_size: [144, 256]

    # --- 瓶颈前的通道压缩（决定过拟合程度，别乱改）---
    # 展平进瓶颈之前先用 1×1 卷积把通道从 128 压到这个数。
    #
    # 不做这一步时：feat_dim = 128×9×16 = 18432，
    #   to_latent + from_latent = 2×18432×256 ≈ 9.4M 参数，占整个模型的约 90%。
    #   在 3605 张训练图上训 10M 参数，实测**留出集误差比训练集高 45.6%**（明显过拟合）。
    # 压到 32 之后：feat_dim = 4608，两个全连接降到 2.36M，模型总量 10.5M -> 约 3.4M。
    pre_latent_channels: 32

    # --- 编码器：多尺度并行卷积核 ---
    # 不同类型的退化破坏不同尺度的结构，单尺度堆叠要靠深度间接发现这些线索：
    #   雾    -> 高频对比度压缩，细纹理先消失            -> 3×3 分支主导
    #   模糊  -> 边缘锐度丢失，中尺度轮廓变糊            -> 3×3 / 5×5
    #   黑暗  -> 全局亮度塌陷 + 传感器噪声                -> 7×7（大结构）/ 3×3（噪声）
    #   遮挡  -> 大片连续区域覆盖，破坏整体布局          -> 7×7
    # 并行摆出三个尺度，再由 1×1 卷积在通道维融合，学「这个场景下哪个尺度更可信」。
    encoder_type: multiscale    # multiscale | plain（plain 仅用于消融对比）
    kernel_sizes: [3, 5, 7]     # 三条并行分支的核尺寸
    # 各分支先用 1×1 把通道压到 out/3 再卷积。5×5/7×7 的参数量是 3×3 的
    # 2.8 倍与 5.4 倍，不做这个降维一个 block 就要 1.4M 参数；
    # 降维后约 1/8，多尺度的表达能力基本保留。做消融时可关掉。
    use_bottleneck: true

    # --- 空洞卷积（扩大感受野的可选手段）---
    # 与 kernel_sizes 一一对应，全 1 即普通卷积（默认）。
    #
    # 什么时候值得开：想在不增加参数的前提下扩大感受野时。
    #   方案 A（当前默认）: kernel_sizes=[3,5,7], dilations=[1,1,1]
    #                      有效感受野 3 / 5 / 7，参数量按真实核算
    #   方案 B           : kernel_sizes=[3,3,3], dilations=[1,2,3]
    #                      有效感受野 3 / 5 / 7（相同！），参数量只有 A 的约 1/3
    #   方案 C           : kernel_sizes=[3,3,3], dilations=[1,2,4]
    #                      有效感受野 3 / 5 / 9，比 A 更大且更省
    #
    # 为什么默认没开：多尺度分支已显式给出 3/5/7 三个尺度，
    # 且瓶颈层的全连接（9×16×128 → 256）本身就把全局信息混在一起，
    # 全局感受野是有的。空洞卷积在这里有一部分是冗余的。
    # 是否真有增益要靠消融测，不要凭直觉打开 —— 见下方 ablations。
    dilations: [1, 1, 1]

  # --- 训练 ---
  train:
    epochs: 40
    batch_size: 32           # 256×144 的输入很小，batch 可以开大
    lr: 1.0e-3
    weight_decay: 0.0        # AE 上加 wd 会让重建变糊，反而抹掉高频信号
    optimizer: adamw
    amp: true
    dtype: bfloat16          # bfloat16 | float16（梯度缩放）| float32；bf16 不支持时保留 GPU 改用 fp32
    # 轻微光度抖动，模拟曝光差异。**不允许**模糊/降对比度/加雾 ——
    # 把退化当增强喂进去等于教 AE「退化也是正常的」，判别力会被自己毁掉。
    augment: true
    augmentation:
      contrast_range: [0.9, 1.1]       # 光度对比度倍率，围绕灰度 0.5 调整
      brightness_range: [-0.03, 0.03] # [0,1] 图像上的亮度偏移

    # --- 去噪自编码器（正则化，抑制过拟合）---
    # 只给**输入**加高斯噪声，重建目标仍是无噪原图。
    # 为什么不用 weight decay：wd 会把重建推向「保守的模糊均值」，
    # 而模糊恰好抹掉我们要检测的高频信号 —— 等于用正则化换掉判别力。
    # 去噪目标则是逼模型学到「内容的不变结构」，对本任务更合适。
    # 0 表示关闭（退化为普通自编码器）。
    denoise_sigma: 0.06
    grad_clip_norm: 1.0
    seed: 42
    # 早停：验证集（留出的参考图）重建误差不再下降就停
    early_stopping:
      enabled: true
      patience: 8
      min_delta: 1.0e-5
    checkpoint_dir: artifacts/checkpoints/visibility

  # --- 消融实验预设 ---
  # 写在这里是为了让「做过哪些对比」可复现，而不是靠记忆。
  # 用法: python scripts/train_visibility.py --config <复制后改过的配置>
  ablations:
    - tag: plain_encoder        # 单尺度 4×4 卷积，验证多尺度是否真有增益
      set: {model.encoder_type: plain}
    - tag: no_bottleneck        # 关掉 1×1 降维，看参数量与效果的权衡
      set: {model.use_bottleneck: false}
    # ⚠️ 改 kernel_sizes 必须同步改 dilations —— 两者长度必须一致，
    #    否则 MultiScaleBlock 会直接抛 ValueError（这个约束是有意的：
    #    静默补齐长度会让「我以为配了 3 个分支」这类错误更难发现）。
    - tag: kernels_3_5          # 去掉 7×7 分支，看大尺度是否必要
      set: {model.kernel_sizes: [3, 5], model.dilations: [1, 1]}
    - tag: single_kernel_3      # 只留 3×3，等价于把多尺度退化成单尺度并行
      set: {model.kernel_sizes: [3], model.dilations: [1]}
    # --- 空洞卷积对比：三条路线的有效感受野可比，参数量差 3 倍 ---
    - tag: dilated_same_rf      # 3/5/7 的有效感受野，参数量约 1/3（方案 B）
      set: {model.kernel_sizes: [3, 3, 3], model.dilations: [1, 2, 3]}
    - tag: dilated_larger_rf    # 有效感受野 3/5/9，比默认更大且更省（方案 C）
      set: {model.kernel_sizes: [3, 3, 3], model.dilations: [1, 2, 4]}

  # --- 特征打分参数 ---
  # 这些参数与下方 thresholds 共用一套打分尺度；调整后必须重新评估并重标阈值。
  scoring:
    features:
      edge_gradient_threshold: 0.04  # 输入灰度归一化到 [0,1] 后的梯度幅值阈值
      hf_cutoff_ratio: 0.50           # 频谱半径分界：外侧视作高频
    feature_scales:
      contrast: 0.25
      entropy: 8.0
      edge_density: 0.15
      hf_ratio: 0.05
    aggregation:
      weights:
        contrast: 0.40
        entropy: 0.25
        edge_density: 0.25
        hf_ratio: 0.10
      power: -1.0                     # 广义平均阶数；负数会更关注塌陷的特征维
      feature_floor: 0.10             # 避免单维接近零后完全支配总分
    reconstruction_error:
      block_grid: [3, 3]              # 分块误差统计网格（行、列）

  # --- 判定阈值 ---
  #
  # ⚠️⚠️ 这些数值与上方 scoring 配置强耦合。
  #     改动特征尺度或聚合参数会改变分数尺度，旧阈值立即失效，必须重新标定。
  #
  # 标定依据（实测，非估计）：
  #
  #   合成退化 @ 最大强度（确定无疑「看不见」，由 degradation.py 人工构造）
  #     fog       0.132        occlusion  0.127
  #     darkness  0.112        blur       0.280      ← 四者中最高
  #
  #   真实 ACDC 各条件下的最低分（这些是「难但可用」，**不能**被判 BLIND）
  #     night  0.416  ← 全局最低    fog  0.480
  #     rain   0.639              snow 0.620
  #
  #   可分区间 = [0.280, 0.416]，info_blind 取该区间中部 0.34，
  #   两侧各留约 0.07 的余量。
  #
  # 标定原则（与 docs/handover_policy.md 的「宁可保守」不同，见 gate.py 模块头）：
  #   ACDC 里**没有**「看不清」的帧 —— 否则它不成其为数据集。
  #   它的最暗帧是「很暗但可用」，判成 BLIND 等于把夜路子集整个废掉。
  #   所以阈值必须落在「比 ACDC 里任何一帧都更糟」之外，
  #   只有真实部署中才会遇到。
  thresholds:
    # 信息量分数（加权广义平均，值域 0~1）
    info_blind: 0.34         # 低于此值直接判 BLIND
    # 低于此值至少判 DEGRADED。
    # 取 0.50 会让部分夜路/雾天帧落到 DEGRADED —— 这是**期望行为**：
    # 恶劣天气本来就是降级场景，应当下调下游置信度，但不该阻断感知。
    info_degraded: 0.50
    # 重建误差 z 分数（相对正常天气参考图的分布）
    z_degraded: 3.0          # 高于此值至少判 DEGRADED
    z_blind: 8.0             # 高于此值**且**信息量偏低才判 BLIND（双条件）

    # ⚠️ 是否让重建误差参与判定。**默认关闭，这是实测结论。**
    #
    # 实测（150 张/组）重建误差与退化程度**系统性反相关**：
    #   清晰图 -0.57 | 合成 fog -1.80 | darkness -1.80 | occlusion -1.60 | blur -1.36
    #   真实 fog -1.58 | night -0.41 | rain -0.10 | snow -0.63
    #
    # 雾和黑暗抹掉高频细节 → 图像变低秩 → AE 反而重建得更好，误差更低。
    # 于是 `z > z_blind` 对退化图永远不触发（死规则）；
    # 反过来用「z 低即退化」又会命中真实浓雾（-1.58），而浓雾是四个合法子集之一。
    #
    # 所以判定只依赖信息量特征；重建误差照常计算并写进报告供观察。
    # 要重新启用，先用 evaluate_visibility.py 确认新模型的 recon_z 恢复了判别力。
    use_recon_z: false
  # 缺少零校准统计时是否拒绝给出 BLIND 判定（降级为 DEGRADED）
  # 保持 true：单靠信息量一路信号判 BLIND，误判代价太高
  require_calibration: true
  # DEGRADED 时下游模型置信度缩放；VISIBLE 固定为 1，BLIND 固定为 0。
  degraded_confidence_multiplier: 0.6

  # --- 合成退化（仅用于验证，不参与训练）---
  # 造出「确定无疑看不见」的样本来度量门控的召回率。
  # 这是没有真值标签时唯一能定量验证的手段 ——
  # 我们自己造的退化，我们当然知道它是「看不见」的。
  degradation:
    fog:
      # 用暗通道先验式的雾模拟：向图像混入随深度变化的白化层
      transmission_range: [0.05, 0.30]   # 透射率，越小雾越浓
      atmospheric_light: 1.0
    darkness:
      # gamma 拉伸 + 亮度缩放，模拟完全无照明
      gamma_range: [3.0, 6.0]
      scale_range: [0.02, 0.10]
    occlusion:
      # 遮挡：模拟镜头被泥污/雪覆盖
      coverage_range: [0.75, 0.98]
    blur:
      # 强模糊：模拟对焦失败或镜头严重失焦
      kernel_range: [15, 41]
    # 应当被判为 BLIND 的比例下限。低于这个数说明门控漏了。
    expected_recall: 0.90

  # --- 评估输出 ---
  report:
    output_dir: artifacts/reports/visibility
    # 每个条件下抽样多少张做分数分布统计（全量太慢，抽 200 张足够看分布）
    sample_per_condition: 200
    # 把判定为 BLIND/DEGRADED 的样例导出成拼图，供人工复核
    export_gallery: true
    gallery_size: 32

  # --- 设备 ---
  # auto：检测当前 PyTorch/驱动能否使用 CUDA，有可用 GPU 时优先 CUDA，否则 CPU。
  # 可显式设 cpu 或 cuda:0；强制 CUDA 但不可用时会报错，不会静默改用 CPU。
  device: auto
