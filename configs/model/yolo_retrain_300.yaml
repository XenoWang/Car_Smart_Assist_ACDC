yolo_detection:
  model: artifacts/checkpoints/yolo_pretrained/yolo11n.pt
  data: data/processed/acdc_lost_and_found_yolo/data.yaml
  project: artifacts/runs/detection
  name: retrain_300_20261017
  device: auto
  checkpoint: artifacts/runs/detection/retrain_300_20261017/weights/best.pt
  calibration_file: artifacts/reports/retrain_300_20261017/detection/calibration.json
  inference:
    imgsz: 960
    confidence: 0.25
    iou: 0.5
    max_det: 100
    obstacle_class: road_obstacle
  train:
    epochs: 300
    resume_extra_epochs: null
    patience: 30
    seed: 42
    deterministic: true
    imgsz: 960
    batch: 4
    workers: 2
    amp: true
    cache: false
    optimizer: AdamW
    lr0: 0.0002
    warmup_bias_lr: 0.0
    warmup_epochs: 3.0
    weight_decay: 0.0005
    mosaic: 0.0
    close_mosaic: 5
    mixup: 0.0
    plots: true
    copy_paste: 0.0
    cutmix: 0.0
    degrees: 0.0
    translate: 0.0
    scale: 0.0
    shear: 0.0
    perspective: 0.0
    fliplr: 0.0
    flipud: 0.0
    multi_scale: false
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
  enabled_for_inference: true
  joint_foreground_exclusive: true
