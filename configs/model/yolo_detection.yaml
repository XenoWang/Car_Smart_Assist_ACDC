# YOLO11 nano 检测基线；YOLO 的训练/推理后端仍是 PyTorch。
yolo_detection:
  model: artifacts/checkpoints/yolo_pretrained/yolo11n.pt
  data: data/processed/acdc_detection_yolo/data.yaml
  project: artifacts/runs/detection
  name: yolo11n_acdc
  device: auto                  # 优先 CUDA；不可用时 CPU
  checkpoint: artifacts/runs/detection/yolo11n_acdc/weights/best.pt
  calibration_file: artifacts/reports/detection/yolo11n_acdc/calibration.json
  inference:
    imgsz: 960                  # 仅在 val 上比较 640/960 后选定；训练保持 640
    confidence: 0.25             # calibration 完成且权重匹配时使用其选出的阈值
    iou: 0.5
    max_det: 100
  train:
    epochs: 30
    resume_extra_epochs: null    # 可设正整数：已有完整训练状态时追加指定轮数
    patience: 8
    seed: 42
    deterministic: true
    imgsz: 640
    batch: 8
    workers: 2
    amp: true
    cache: false                # 不将全量高清图常驻内存
    optimizer: AdamW
    lr0: 0.001
    warmup_bias_lr: 0.0          # 新的 AdamW 训练不沿用 SGD 的 0.1 bias warmup 默认值
    warmup_epochs: 3.0
    weight_decay: 0.0005
    mosaic: 0.5
    close_mosaic: 5
    mixup: 0.0
    plots: true
