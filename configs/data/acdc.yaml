# =============================================================================
# ACDC 数据配置
# =============================================================================
# 数据集：ACDC — Adverse Conditions Dataset with Correspondences (ETH Zurich, ICCV 2021)
#   官网   https://acdc.vision.ee.ethz.ch/
#   规模   4006 张图像，覆盖 fog / night / rain / snow 四类恶劣天气
#   标注   语义分割 + panoptic + 图像间对应关系
#   注意   **原生没有车辆距离/检测框标注** —— 距离任务必须由外部数据补充，
#          见 configs/data/distance_supplement.yaml 与 docs/label_spec.md
#
# 许可是研究用途且禁止再分发，所以 data/ 整个目录已在 .gitignore 中。
# 公开仓库里只能写「怎么获取」，不能附带数据本身。
# =============================================================================

base: default.yaml

data:
  name: acdc
  root: data

  # --- 四个恶劣天气子集 ---
  # 各子集样本量基本均衡（train 每类 400，val 100 或 106，test 每类 500），
  # 但 night 的 val 多 6 张，做严格分层实验时注意这点差异
  subsets:
    - fog
    - night
    - rain
    - snow

  # --- 划分 ---
  # 更正（解压后核实）：ACDC **自带官方 train/val/test 划分**，按 sequence 切好。
  # 早期配置写的是「官方不提供划分，自己按 70/15/15 切」—— 那是错的。
  #
  # 必须用官方划分，理由：
  #   1. 用自造划分的结果无法与已发表论文对比，项目的指标失去参照系
  #   2. 官方划分已保证同一 sequence 不跨集合，帧间泄漏问题官方已处理
  #   3. test 集标注官方不公开（只给 image_info），想自己切也无从评估
  split:
    source: official           # official | custom
    # 官方划分的实测数量（详见 docs/dataset.md 4.1）
    counts:
      train: { fog: 400, night: 400, rain: 400, snow: 400 }        # 合计 1600
      val:   { fog: 100, night: 106, rain: 100, snow: 100 }        # 合计 406
      test:  { fog: 500, night: 500, rain: 500, snow: 500 }        # 合计 2000
    # 正常天气参考图（train_ref / val_ref / test_ref），与恶劣天气图一一对应。
    # 用于做跨天气泛化实验，不参与主训练
    use_reference_images: false
    # 有语义标注的仅 2006 张（train 1600 + val 406），test 标注官方不公开
    annotated_counts: { train: 1600, val: 406 }
    # 仅在 source=custom 时生效；默认不启用
    custom:
      strategy: by_scene
      train: 0.70
      val: 0.15
      test: 0.15
    split_file: data/processed/acdc/split.json  # 记录实际使用的划分，保证可复现

  # --- 图像 ---
  image:
    # 训练分辨率。ACDC 原图 1920x1080
    train_size: [1024, 512]   # [宽, 高]，2:1 是分割常用的折中
    eval_size: [2048, 1024]
    # 保持长宽比 + padding，优于直接拉伸（拉伸会让测距的几何关系失效）
    keep_aspect_ratio: true

  # --- 标签 ---
  labels:
    num_classes: 19            # 映射到 Cityscapes 的 19 类体系，便于复用预训练权重
    ignore_index: 255
    # 官方调色板，保证可视化颜色在不同实验间一致
    use_official_palette: true
    mapping_file: src/car_smart_assist/data/label_mapping.py

  # --- 增强 ---
  augmentation:
    train:
      random_resize: { scale_range: [0.5, 2.0] }
      random_crop:   { size: [1024, 512] }
      horizontal_flip: { p: 0.5 }
      photometric:
        brightness_contrast: { p: 0.5, limit: 0.2 }
        hue_saturation:      { p: 0.3, limit: 0.1 }
      # 天气增强：用于做「同分布 vs 跨分布」的鲁棒性对比实验
      weather:
        enabled: false          # 默认关闭。开启前先跑一次基线，否则说不清提升来自哪里
        fog:   { p: 0.0, intensity: [0.1, 0.5] }
        rain:  { p: 0.0, intensity: [0.1, 0.4] }
        snow:  { p: 0.0, intensity: [0.1, 0.3] }
        night: { p: 0.0, gamma_range: [1.5, 3.0] }
    # 验证/测试不做任何随机增强，只做 resize 与归一化
    val:
      resize_only: true

  # --- 归一化：训练与推理必须用同一套，否则指标会对不上 ---
  normalization:
    mean: [0.485, 0.456, 0.406]   # ImageNet 统计量，与骨干网预训练一致
    std:  [0.229, 0.224, 0.225]

  # --- DataLoader ---
  loader:
    batch_size: 4                 # 12GB 显存 + 1024x512 + 多任务头，从 4 起步再往上试
    num_workers: 4                # Windows 上过大反而慢（进程启动开销高）
    pin_memory: true
    persistent_workers: true
    drop_last: true               # 多任务训练里丢掉不完整的最后一个 batch，避免 loss 抖动
    prefetch_factor: 2
