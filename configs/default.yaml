project:
  name: car-smart-assist
  experiment_tag: baseline
  description: "ACDC 复杂路况感知 + 司机提示生成"

reproducibility:
  seed: 42
  deterministic: false

device:
  target: auto
  verify_arch: true
  amp:
    enabled: true
    dtype: bf16
  cudnn_benchmark: true

paths:
  data_root: data
  raw: data/raw
  interim: data/interim
  processed: data/processed
  artifacts: artifacts
  checkpoints: artifacts/checkpoints
  logs: artifacts/logs
  predictions: artifacts/predictions
  reports: artifacts/reports

logging:
  level: INFO
  colorize: true
  file_pattern: "train_{time}.log"
  log_every_n_steps: 50

tracking:
  backend: tensorboard
  log_dir: artifacts/logs

numerics:
  grad_clip_norm: 1.0
  detect_anomaly: false
  fail_on_nan: true
