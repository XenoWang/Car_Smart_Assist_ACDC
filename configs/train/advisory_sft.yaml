# 通用多任务／Stage 2框架的预留配置；对应通用入口尚未实现，当前三模型使用专用入口与配置。
base: ../default.yaml
data: ../data/acdc.yaml
model: ../model/advisory_llm.yaml

train:
  dataset:
    train_file: data/processed/instruction/train.jsonl
    val_file:   data/processed/instruction/val.jsonl
    max_image_pixels: 501760   # 约 896x560
    max_length: 1024           # 指令 + 回复的总 token 上限

  epochs: 8                    # 预留训练预算；合适轮数与过拟合情况须由验证集判断
  batch_size: 1
  gradient_accumulation_steps: 16   # 等效批量 16
  length_grouped_batching: true

  lora:
    r: 16                      # 预留LoRA秩，尚未在本项目训练或比较收益
    lora_alpha: 32             # 一般取 2*r
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj

  optimizer:
    name: adamw_8bit           # 8-bit 优化器，省显存
    lr: 2.0e-4                 # LoRA 的学习率比全参微调高 1-2 个数量级
    weight_decay: 0.0          # 预留权重衰减值，收益尚未在本项目验证
    betas: [0.9, 0.999]

  scheduler:
    name: cosine
    warmup_ratio: 0.03

  amp:
    enabled: true
    dtype: bfloat16

  validation:
    every_n_epochs: 1
    monitor: val/takeover_miss_rate
    mode: min                  # 漏报率越低越好
    secondary_monitor: val/false_alarm_rate

  checkpoint:
    save_dir: artifacts/checkpoints/advisory
    save_top_k: 2
    save_last: true
    monitor: val/takeover_miss_rate
    mode: min
    merge_on_save: false       # 不合并进基座，保持适配器独立，便于切换基座对比

  log_every_n_steps: 10
  sample_generation_every_n_epochs: 1
  sample_generation_n: 5

  seed: 42

