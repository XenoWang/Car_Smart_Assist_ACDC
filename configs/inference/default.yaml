base: ../default.yaml
data: ../data/acdc.yaml
model: ../model/perception_multitask.yaml
advisory: ../model/advisory_llm.yaml

inference:
  perception_checkpoint: null
  advisory_checkpoint: null

  device: auto
  dtype: bfloat16
  batch_size: 8                # 纯推理没有激活值存留，batch 可以比训练大得多
  num_workers: 4

  preprocessing:
    inherit_from_data_config: true
    override: null

  segmentation:
    tta:
      enabled: false
      scales: [0.75, 1.0, 1.25]
      flip: true
    min_region_size: 64

  detection:
    score_threshold: 0.3
    nms_iou_threshold: 0.5
    max_detections: 20

  evaluation:
    splits: [val, test]
    per_weather_subset: true
    distance_buckets: true
    export_failure_cases: true
    n_failure_cases: 20

  report:
    formats: [json, markdown]
    output_dir: artifacts/reports
    figures:
      - confusion_matrix        # 接管边界与路况分类的混淆矩阵
      - distance_error_curve    # 误差随距离变化的曲线，按天气分组
      - pr_curve                # 接管边界的 precision-recall 曲线 + 阈值扫描
      - failure_gallery         # 失败案例拼图
      - qualitative_samples     # 好例子拼图（报告里不能只放坏例子）
    compare_previous: true

  profiling:
    enabled: true
    warmup_iterations: 10      # 前几次推理包含 CUDA 初始化与 kernel 编译，必须剔除
    measure_iterations: 50
    report_percentiles: [50, 95, 99]
